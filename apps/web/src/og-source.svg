  <circle cx="940" cy="317" r="66" fill="none" stroke="#e8aa48" stroke-width="3"/>
  <circle cx="940" cy="317" r="35" fill="#e8aa48"/>
  <circle cx="1042" cy="250" r="5" fill="#f4f1e8"/>
  <text x="72" y="116" fill="#e8aa48" font-family="Nebula Sans" font-size="22" font-weight="700">Slopcamera</text>
  <image href="og-serif-hero.png" x="0" y="0" width="1200" height="630"/>
  <text x="72" y="525" fill="#9d9b97" font-family="Nebula Sans" font-size="21" font-weight="400">Your agent writes a short source file, and the CLI renders and checks it.</text>
