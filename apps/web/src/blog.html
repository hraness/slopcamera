<!doctype html>
<html lang="en" data-theme="system" data-hraness-theme="paper">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f8f7f4" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#12100f" media="(prefers-color-scheme: dark)">
    <script src="{{THEME_ASSET}}"></script>
    <title>{{BLOG_TITLE}} · Slopcamera</title>
    <meta name="description" content="{{BLOG_DESCRIPTION}}">
    <meta name="application-name" content="Slopcamera">
    <meta name="generator" content="Bun 1.3.14">
    <meta name="robots" content="{{BLOG_ROBOTS}}">
    <link rel="canonical" href="{{BLOG_CANONICAL}}">
    <link rel="icon" href="/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    {{SITE_STYLES}}
    <link rel="sitemap" type="application/xml" href="/sitemap.xml">
    <link rel="alternate" type="text/markdown" href="{{BLOG_MARKDOWN}}">
    <link rel="alternate" type="application/atom+xml" title="Slopcamera blog" href="/blog/feed.xml">
    <link rel="describedby" href="/llms.txt">

    <meta property="og:type" content="{{BLOG_OG_TYPE}}">
    <meta property="og:site_name" content="Slopcamera">
    <meta property="og:title" content="{{BLOG_TITLE}} · Slopcamera">
    <meta property="og:description" content="{{BLOG_DESCRIPTION}}">
    <meta property="og:url" content="{{BLOG_CANONICAL}}">
    <meta property="og:image" content="https://slopcamera.com/og.png">
    <meta property="og:image:alt" content="Slopcamera, a visual studio for coding agents, beside a camera-frame and lens motif">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    {{BLOG_ARTICLE_META}}

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{BLOG_TITLE}} · Slopcamera">
    <meta name="twitter:description" content="{{BLOG_DESCRIPTION}}">
    <meta name="twitter:image" content="https://slopcamera.com/og.png">
    <meta name="twitter:image:alt" content="Slopcamera, a visual studio for coding agents, beside a camera-frame and lens motif">

    <script type="application/ld+json">
{{BLOG_JSONLD}}
    </script>
  </head>
  <body>
    <a class="skip-link {{SITE_SKIP_CLASS}}" href="#main">Skip to content</a>
    <header class="topbar {{SITE_HEADER_CLASS}}">
      <a aria-label="Slopcamera home" class="wordmark {{SITE_WORDMARK_CLASS}} hraness-foil-text" data-foil="" href="/"><span aria-hidden="true" class="hraness-foil-mark" data-foil=""><img alt="" aria-hidden="true" class="{{SITE_BRAND_MARK_CLASS}} hraness-foil-mark__image" height="22" src="/marks/slopcamera.svg" width="22"><span aria-hidden="true" class="hraness-foil-mark__paint"></span></span>Slopcamera</a>
      <div class="topbar-actions {{SITE_ACTIONS_CLASS}}">
        <nav aria-label="Primary" class="{{SITE_NAVIGATION_CLASS}}">
          <a class="{{SITE_NAVIGATION_LINK_CLASS}}" href="/">Home</a>
          <a class="{{SITE_NAVIGATION_LINK_CLASS}}" href="/docs">Docs</a>
          <a class="{{SITE_NAVIGATION_LINK_CLASS}}" href="/blog">Blog</a>
          <a class="{{SITE_NAVIGATION_LINK_CLASS}}" href="https://github.com/hraness/slopcamera">GitHub</a>
        </nav>
        {{APPEARANCE_MENU}}
      </div>
    </header>
    <main id="main" tabindex="-1">
      {{BLOG_MAIN}}
    </main>
    {{HRANESS_SITE_FOOTER}}
  </body>
</html>
