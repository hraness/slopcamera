<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Attention Turns Its Many Heads</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent !important; }
      canvas { display: block; width: 100%; height: 100%; }
      .word { position: absolute; transform: translate(-50%, -50%); font: italic 400 1.7vw/1 Georgia, serif; color: #edd6a9; white-space: nowrap; text-shadow: 0 .15vw .6vw rgb(20 30 34 / 70%); }
      .word.key { color: #f3c35f; font-weight: 700; }
      .caption { position: absolute; left: 5.5%; bottom: 6.5%; font: 600 1.05vw/1.4 Georgia, serif; letter-spacing: .32em; text-transform: uppercase; color: #edd6a9; opacity: .8; }
    </style>
    <script type="importmap">{"imports":{"three":"/.slopcamera-overlay/libraries/12e6dd7a5cceb3efd76f8c65acbf5aa55c74820115d9ebae874b28456b9ddb5c.mjs"}}</script>
  </head>
  <body>
    <canvas aria-label="A clay guardian with eight heads turns all of them toward one word on the beat while a gate lights behind it"></canvas>
    <div class="caption">Myth VIII &nbsp;·&nbsp; The many-headed guardian &nbsp;·&nbsp; Attention Turns Its Many Heads</div>
    <script type="module">
      import * as THREE from "three";

      const P = SlopcameraOverlay.parameters;
      const EXPOSURE = P.exposureUs.split(",").map(Number);
      const BOIL = Object.fromEntries(Object.entries(P.boil).map(([key, value]) => [key, value.split(",").map(Number)]));
      const styleFrame = (timeMs) => {
        const frame = Math.min(EXPOSURE.length - 1, Math.max(0, Math.round((P.timeOffsetSeconds * 1000 + timeMs) * 24 / 1000)));
        return { frame, t: EXPOSURE[frame] / 1e6, boil: (channel) => BOIL[channel][frame] };
      };
      const music = { bpm: 90, beatOffsetUs: 0, beatsPerBar: 4, ...P.music };
      const pal = P.palette;
      const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
      const smooth = (a, b, v) => { const x = clamp((v - a) / (b - a)); return x * x * (3 - 2 * x); };
      const jitter = (seedValue, i) => { const s = Math.sin(i * 12.9898 + seedValue * 78.233) * 43758.5453; return s - Math.floor(s) - 0.5; };

      // The soundtrack's bands-v1 sidecar is present for films; stills are silent.
      let audio = null;
      SlopcameraOverlay.ready((async () => {
        let url;
        try { url = SlopcameraOverlay.asset("audio-reactivity"); } catch { return; }
        const response = await fetch(url);
        audio = SlopcameraOverlay.prepareAudioReactivity(await response.json());
      })());

      const canvas = document.querySelector("canvas");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(devicePixelRatio);
      renderer.setSize(SlopcameraOverlay.width, SlopcameraOverlay.height, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(pal.background);
      scene.fog = new THREE.Fog(pal.background, 12, 26);
      const camera = new THREE.PerspectiveCamera(36, SlopcameraOverlay.width / SlopcameraOverlay.height, 0.1, 80);
      scene.add(new THREE.HemisphereLight(0xf2e2c0, 0x1c2a30, 1.1));
      const key = new THREE.SpotLight(0xffe0b0, 260, 40, 0.55, 0.5);
      key.position.set(5, 9, 7); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
      scene.add(key, key.target);
      const gateLight = new THREE.PointLight(pal.secondary, 0, 14);
      gateLight.position.set(0, 2.6, -3.2);
      scene.add(gateLight);

      const clay = (color) => new THREE.MeshStandardMaterial({ color, roughness: 0.92, metalness: 0 });
      const bodyMat = clay(pal.primary), neckMat = clay("#6f978c"), headMat = clay(pal.primary), snoutMat = clay(pal.paper);
      const eyeMat = new THREE.MeshStandardMaterial({ color: pal.paper, emissive: pal.secondary, emissiveIntensity: 0.4, roughness: 0.4 });
      const sphere = new THREE.SphereGeometry(1, 28, 20);
      const floor = new THREE.Mesh(new THREE.CylinderGeometry(6.5, 6.8, 0.4, 64), clay("#8c6f4f"));
      floor.position.y = -0.2; floor.receiveShadow = true; scene.add(floor);
      const body = new THREE.Mesh(sphere, bodyMat);
      body.scale.set(1.7, 1.15, 1.4); body.position.set(0, 0.8, 0); body.castShadow = true; scene.add(body);
      const gateMat = new THREE.MeshStandardMaterial({ color: "#8c6f4f", emissive: pal.secondary, emissiveIntensity: 0, roughness: 0.8 });
      const gate = new THREE.Mesh(new THREE.TorusGeometry(2.6, 0.32, 20, 64, Math.PI), gateMat);
      gate.position.set(0, 0, -3.6); gate.castShadow = true; scene.add(gate);
      const portal = new THREE.Mesh(new THREE.CircleGeometry(2.3, 64, 0, Math.PI), new THREE.MeshBasicMaterial({ color: pal.secondary, transparent: true, opacity: 0 }));
      portal.position.set(0, 0, -3.62); scene.add(portal);

      const words = ["the", "gate", "of", "meaning", "opens", "for", "one", "word"];
      const KEY = 3;
      const wordPos = words.map((_, i) => {
        const a = -1.05 + i / (words.length - 1) * 2.1;
        return new THREE.Vector3(Math.sin(a) * 4.6, 2.3 + 0.55 * Math.cos(i * 1.7), Math.cos(a) * 4.6 - 1.2);
      });
      const labels = words.map((w, i) => {
        const el = document.createElement("div");
        el.className = "word" + (i === KEY ? " key" : "");
        el.textContent = w;
        document.body.append(el);
        return el;
      });
      const heads = words.map((_, i) => {
        const a = -1.2 + i / (words.length - 1) * 2.4;
        const anchor = new THREE.Vector3(Math.sin(a) * 1.2, 1.5, Math.cos(a) * 0.9);
        const rest = new THREE.Vector3(Math.sin(a) * 2.5, 2.9 + 0.45 * ((i % 2) ? 1 : -0.4), Math.cos(a) * 1.9);
        const neck = Array.from({ length: 7 }, () => { const m = new THREE.Mesh(sphere, neckMat); m.castShadow = true; scene.add(m); return m; });
        const head = new THREE.Group();
        const skull = new THREE.Mesh(sphere, headMat); skull.scale.set(0.42, 0.36, 0.46); skull.castShadow = true;
        const snout = new THREE.Mesh(sphere, snoutMat); snout.scale.set(0.24, 0.18, 0.34); snout.position.set(0, -0.08, 0.4); snout.castShadow = true;
        const eyes = [-1, 1].map((s) => { const e = new THREE.Mesh(sphere, eyeMat); e.scale.setScalar(0.075); e.position.set(s * 0.2, 0.12, 0.32); return e; });
        head.add(skull, snout, ...eyes);
        scene.add(head);
        return { anchor, rest, neck, head };
      });
      const look = new THREE.Vector3(), headPos = new THREE.Vector3(), mid = new THREE.Vector3(), q = new THREE.Vector3(), screen = new THREE.Vector3();

      SlopcameraOverlay.onFrame(({ timeMs }) => {
        const { t, boil } = styleFrame(timeMs);
        const timeUs = Math.round(t * 1e6);
        const clock = SlopcameraOverlay.musicClock(timeUs, music);
        const pulse = SlopcameraOverlay.musicPulse(clock.beatPhase, 0.5);
        const band = audio ? audio.sample(timeUs) : { bass: 0.35 * pulse, treble: 0.2, energy: 0.3 };
        // Bar 0: every head watches its own word. Bar 1: the turn, snapped on the downbeat. Bar 2: the gate opens.
        const barPos = clock.barIndex + clock.barPhase;
        const turn = smooth(0.98, 1.06, barPos);
        const open = smooth(2.0, 2.4, barPos);
        const pose = boil("pose"), clayB = boil("clay");
        heads.forEach((h, i) => {
          const own = wordPos[i], target = wordPos[KEY];
          look.copy(own).lerp(target, turn);
          headPos.copy(h.rest).lerp(look, 0.12 + 0.08 * turn);
          headPos.y += 0.12 * pulse * (1 - turn * 0.5) + 0.05 * Math.sin(t * 1.3 + i);
          headPos.x += jitter(pose, i) * 0.03; headPos.y += jitter(pose, i + 20) * 0.03;
          h.head.position.copy(headPos);
          h.head.lookAt(look);
          h.head.rotateZ(jitter(pose, i + 40) * 0.05);
          h.head.scale.setScalar(1 + jitter(clayB, i) * 0.03);
          mid.copy(h.anchor).lerp(headPos, 0.5); mid.y += 0.5;
          h.neck.forEach((m, k) => {
            const u = (k + 1) / (h.neck.length + 1);
            q.copy(h.anchor).multiplyScalar((1 - u) * (1 - u)).addScaledVector(mid, 2 * u * (1 - u)).addScaledVector(headPos, u * u);
            m.position.copy(q);
            m.scale.setScalar((0.26 - 0.1 * u) * (1 + jitter(clayB, i * 10 + k) * 0.06));
          });
        });
        eyeMat.emissiveIntensity = 0.3 + 1.6 * band.treble;
        gateMat.emissiveIntensity = open * (0.4 + 1.8 * band.bass);
        portal.material.opacity = open * (0.25 + 0.45 * band.bass);
        gateLight.intensity = open * (20 + 90 * band.bass);
        body.scale.set(1.7 + jitter(clayB, 90) * 0.03, 1.15 + 0.03 * pulse, 1.4);
        const orbit = -0.35 + t / 8 * 0.7;
        camera.position.set(Math.sin(orbit) * 11.5, 4.4, Math.cos(orbit) * 11.5);
        camera.lookAt(0, 1.9, 0);
        camera.updateMatrixWorld();
        renderer.render(scene, camera);
        labels.forEach((el, i) => {
          screen.copy(wordPos[i]).project(camera);
          el.style.left = `${(screen.x * 0.5 + 0.5) * 100}%`;
          el.style.top = `${(-screen.y * 0.5 + 0.5) * 100}%`;
          const lit = i === KEY ? 1 : 1 - 0.55 * turn;
          el.style.opacity = String(lit);
          el.style.transform = `translate(-50%, -50%) scale(${i === KEY ? 1 + 0.35 * turn + 0.1 * pulse * turn : 1})`;
        });
      });
    </script>
  </body>
</html>
