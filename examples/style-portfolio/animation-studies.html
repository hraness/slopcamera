(() => {
'use strict';
const canvas = document.getElementById('scene');

const TAU = Math.PI * 2, W = 1920, H = 1080;
const clamp = (x,a=0,b=1) => Math.max(a,Math.min(b,x));
const mix = (a,b,t) => a+(b-a)*t;

const hash = n => {const v=Math.sin(n*127.1+311.7)*43758.5453;return v-Math.floor(v)};
let activeCadence;
function exposureTime(t,fallback=12){const rate=activeCadence?activeCadence.fps/activeCadence.exposureFrames:fallback;return Math.floor(t*rate)/rate}
const rect = (x,y,w,h,color) => {c.fillStyle=color;c.fillRect(x,y,w,h)};
function ellipse(x,y,rx,ry,color,angle=0){c.beginPath();c.ellipse(x,y,rx,ry,angle,0,TAU);c.fillStyle=color;c.fill()}
function path(d,fill,stroke,width=1){const p=new Path2D(d);if(fill){c.fillStyle=fill;c.fill(p)}if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.stroke(p)}}
function poly(points,fill,stroke,width=1){c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.stroke()}}
function line(x,y,x2,y2,color,width=1){c.beginPath();c.moveTo(x,y);c.lineTo(x2,y2);c.strokeStyle=color;c.lineWidth=width;c.stroke()}
function curve(d,color,width=1){path(d,null,color,width)}
function label(s,x,y,size,color,font='sans-serif',align='left'){c.fillStyle=color;c.font=`${size}px ${font}`;c.textAlign=align;c.fillText(s,x,y)}
function gradient(x,y,x2,y2,stops){const g=c.createLinearGradient(x,y,x2,y2);stops.forEach(([p,col])=>g.addColorStop(p,col));return g}
function glow(x,y,r,color){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'transparent');ellipse(x,y,r,r,g)}
function group(x,y,scale,rotation,fn){c.save();c.translate(x,y);c.scale(scale,scale);c.rotate(rotation);fn();c.restore()}
function paper(opacity=.09,seed=0){c.save();c.globalAlpha=opacity;for(let i=0;i<3300;i++){const x=hash(i*2+seed)*W,y=hash(i*2+1+seed)*H;rect(x,y,.6+hash(i+5)*1.4,.6+hash(i+6)*1.4,i%2?'#fff':'#000')}c.restore()}

function stars(count,seed,t,color='#d3d4c5'){for(let i=0;i<count;i++){const x=hash(i*3+seed)*W,y=hash(i*3+seed+1)*630,r=.7+hash(i*3+seed+2)*1.7;c.globalAlpha=.25+.55*(.5+.5*Math.sin(t*.8+i));ellipse(x,y,r,r,color)}c.globalAlpha=1}

      }

function mathematical(t){
  rect(0,0,W,H,'#10151e');

  const activeCount=Math.min(5,1+Math.floor(t/.42)),harmonics=[1,3,5,7,9].slice(0,activeCount);
  label('The geometry of a square wave',122,133,50,'#e8edf5','Georgia');
