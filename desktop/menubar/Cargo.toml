[package]
name = "slopcamera-menubar"
version = "0.1.0"
description = "Slopcamera menu bar: render status, credits and your newest outputs"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
desktop-foundation = { git = "https://github.com/hraness/desktop-foundation", tag = "v0.8.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
