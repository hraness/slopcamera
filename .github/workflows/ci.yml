name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests supersede their own earlier runs; every main push keeps its
  # own group so a later merge never cancels an earlier commit's run.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.routes.outputs.api }}
      desktop: ${{ steps.routes.outputs.desktop }}
      package: ${{ steps.routes.outputs.package }}
      sdk: ${{ steps.routes.outputs.sdk }}
      site: ${{ steps.routes.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Route changed paths
        id: routes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          api=false
          sdk=false
          desktop=false
          package=false
          site=false
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            api=true
            sdk=true
            desktop=true
            package=true
            site=true
          else
            while IFS= read -r path; do
              case "$path" in
                .github/*|package.json|bun.lock|tsconfig.json|eslint.config.mjs|scripts/*)
                  api=true
                  sdk=true
                  desktop=true
                  package=true
                  site=true
                  ;;
                api/*|apps/api/*)
                  api=true
                  ;;
                src/*|schema/*|examples/*|skills/*|packages/scene/*)
                  api=true
                  sdk=true
                  package=true
                  ;;
                AGENTS.md|CONTRIBUTING.md|NOTICE.md|PRIVACY.md|README.md|SECURITY.md|docs/*)
                  sdk=true
                  package=true
                  ;;
              esac
              case "$path" in
                apps/desktop/*|packages/scene/*)
                  desktop=true
                  package=true
                  ;;
                apps/web/*)
                  site=true
                  ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi
          printf 'api=%s\nsdk=%s\ndesktop=%s\npackage=%s\nsite=%s\n' \
            "$api" "$sdk" "$desktop" "$package" "$site" | tee -a "$GITHUB_OUTPUT"

  boundary:
    name: Slopcamera standalone boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun run check:standalone

  copy:
    name: Slopcamera public copy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check:copy --require-history

  sdk:
    name: Slopcamera SDK
    needs: plan
    if: needs.plan.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check:standalone
      - run: bun run check:sdk
      - name: Check generated SDK standalone boundary
        run: bun run check:standalone
      - name: Verify committed SDK output
        run: |
          generated_status="$(git status --porcelain --untracked-files=all -- dist bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi
      - run: bun pm pack --dry-run --ignore-scripts
      - run: node --input-type=module -e 'await Promise.all(["./dist/index.js","./dist/cli.js","./dist/code/index.js","./dist/code/advanced.js","./dist/generate.js","./dist/host-resources.js","./dist/operations.js","./dist/workflow.js"].map(path => import(path)))'

  api:
    name: Slopcamera hosted API
    needs: plan
    if: needs.plan.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check:api

  desktop:
    name: Slopcamera local runtime (${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Together these run every check:desktop phase: `static` runs the
        # effect policy, types, lint and build, and the three test shards
        # partition test:desktop by directory.
        shard: [static, code, cli, rest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install FFmpeg
        if: matrix.shard != 'static'
        run: bash scripts/install-ci-ffmpeg.sh
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Check desktop effect policy, types, lint and build
        if: matrix.shard == 'static'
        run: bun run check:effect && bun run typecheck:desktop && bun run lint:desktop && bun run build:desktop
      - name: Test desktop shard
        if: matrix.shard != 'static'
        run: bun run test:desktop:${{ matrix.shard }}
      - name: Check generated desktop standalone boundary
        run: bun run check:standalone
      - name: Verify committed CLI output
        run: |
          generated_status="$(git status --porcelain --untracked-files=all -- apps/desktop/dist/cli bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi

  site:
    name: Slopcamera site (${{ matrix.part }})
    needs: plan
    if: needs.plan.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Together these run every check:web phase: `compile` runs the
        # repeated full-site compilation suite, and `verify` runs the example
        # sources, theme, preview types, remaining tests, build and browser checks.
        part: [compile, verify]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.1"
          package-manager-cache: false
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Compile the site repeatedly
        if: matrix.part == 'compile'
        run: bun run check:web:compile
      - name: Verify the site with pinned Node and Chromium
        if: matrix.part == 'verify'
        env:
          SLOPCAMERA_SITE_ARTIFACTS: ${{ github.workspace }}/site-browser-artifacts
        run: |
          set -euo pipefail
          NODE_EXECUTABLE_PATH="$(command -v node)"
          PLAYWRIGHT_BROWSERS_PATH="$(mktemp -d "$RUNNER_TEMP/slopcamera-playwright.XXXXXX")"
          export NODE_EXECUTABLE_PATH PLAYWRIGHT_BROWSERS_PATH
          playwright_cli="$("$NODE_EXECUTABLE_PATH" -e 'const { createRequire } = require("node:module"); const { dirname, resolve } = require("node:path"); const appRequire = createRequire(resolve("apps/web/package.json")); const manifest = appRequire.resolve("playwright-core/package.json"); console.log(resolve(dirname(manifest), appRequire(manifest).bin["playwright-core"]))')"
          "$NODE_EXECUTABLE_PATH" "$playwright_cli" install --no-shell chromium
          SLOPCAMERA_CHROME_PATH="$("$NODE_EXECUTABLE_PATH" -e 'const { createRequire } = require("node:module"); const { resolve } = require("node:path"); console.log(createRequire(resolve("apps/web/package.json"))("playwright-core").chromium.executablePath())')"
          test -x "$SLOPCAMERA_CHROME_PATH"
          export SLOPCAMERA_CHROME_PATH
          bun run check:web:verify
      - name: Check generated site standalone boundary
        run: bun run check:standalone
      - name: Upload site browser evidence
        if: always() && matrix.part == 'verify'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slopcamera-site-browser-${{ github.sha }}
          path: site-browser-artifacts/
          if-no-files-found: error
          retention-days: 7

  package:
    name: Slopcamera packed consumer
    needs: plan
    if: needs.plan.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - run: npm install --global npm@11.19.0
      - run: bun run test:package

  required:
    name: Required
    if: always()
    needs: [plan, boundary, copy, api, sdk, desktop, site, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected job
        env:
          PLAN: ${{ needs.plan.result }}
          BOUNDARY: ${{ needs.boundary.result }}
          COPY: ${{ needs.copy.result }}
          API: ${{ needs.api.result }}
          SDK: ${{ needs.sdk.result }}
          DESKTOP: ${{ needs.desktop.result }}
          SITE: ${{ needs.site.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          set -euo pipefail
          [[ "$PLAN" == success ]]
          [[ "$BOUNDARY" == success ]]
          [[ "$COPY" == success ]]
          for result in "$API" "$SDK" "$DESKTOP" "$SITE" "$PACKAGE"; do
            [[ "$result" == success || "$result" == skipped ]]
          done
