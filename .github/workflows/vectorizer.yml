name: Slopcamera VTracer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vectorizer.yml'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'scripts/official-vectorizer-smoke.ts'
      - 'src/vectorize/**'
  pull_request:
    paths:
      - '.github/workflows/vectorizer.yml'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'scripts/official-vectorizer-smoke.ts'
      - 'src/vectorize/**'

permissions:
  contents: read

concurrency:
  group: vtracer-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  official_vtracer:
    name: Slopcamera VTracer (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - target: darwin-x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
          - target: darwin-arm64
            runner: macos-15
            platform: darwin
            arch: arm64
          - target: win32-x64
            runner: windows-2025
            platform: win32
            arch: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      # Pull requests restore main's Bun download cache and never save one.
      # bun install still verifies every package against bun.lock integrity.
      - name: Restore the Bun download cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: vtracer-bun-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Cache Bun downloads
        if: github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: vtracer-bun-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:vectorize:official
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
