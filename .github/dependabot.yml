version: 2
updates:
  - package-ecosystem: bun
    directories:
      - /
      - /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      bun:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
